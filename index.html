<script>
// Content for the Carter family unfolding case (Exam 2, Modules 6–8)
const O = (t, c, w) => ({ t, c, w });
const CASE = {
 "family": [

   "Maya, 16",

 "scenes": [

     ]
    },
    {
     "sata": true,
     "stem": "During Maya's private interview, she asks about birth control. She has had sex without a condom and wants an STI test. She doesn't want her mom told. Which nursing actions are appropriate in Washington State?",

       "t": "Tell her you must inform her mother in the waiting room",

       "c": false,

      {
       "t": "Explain her contraceptive options, risks, and benefits",
       "c": true,

       "t": "Connect the family with SNAP and free school meals",

       "t": "Document it and follow up at next year's checkup",

       "w": "This delays a current basic need."
      },

       "t": "Refer Leo to a dietitian to plan his allergy diet",

  {
   "title": "Scene 2: Maya, six months later",

      {
       "t": "Took a part-time job to save money for a car",
       "c": true,
       "w": "Supports Havighurst's adolescent task of gaining emotional independence from parents."

       "t": "Has never questioned the career her parents chose",
       "c": false,
       "w": "Committing without exploring (foreclosure) isn't an achieved identity."

     ]
    },
    {
     "stem": "Maya started birth control pills. Which teaching approach best fits her cognitive development?",

       "t": "Discuss what to do if she misses a pill, and why",

  {
   "title": "Scene 3: Uncle Sam",

   "story": "Dana's brother Sam, 27, comes in with a knee sprain from pickup basketball. He's a personal trainer.",

    {
     "stem": "Sam mentions several habits. Which statement requires the nurse's priority follow-up?",

       "c": false,

       "c": false,
       "w": "Health maintenance, not urgent."
      },
      {
       "t": "“I drive home after a few beers. I'm fine.”",
       "c": true,
       "w": "Unintentional injury is a leading cause of death in young adults. Impaired driving is an immediate threat to life."

     ]
    },
    {
     "stem": "Sam says, “When a relationship starts getting serious, I end it before anyone gets hurt.” Which response by the nurse is best?",
     "options": [
      {
       "t": "“What happens for you when things get serious?”",
       "c": true,
       "w": "An open-ended question explores his avoidance of closeness. His pattern points toward isolation, not intimacy."

       "t": "“You're young. Focus on your career for now.”",
       "c": false,

       "t": "“Most people your age feel that way at times.”",
       "c": false,
       "w": "Generalizing dismisses him."

      {
       "t": "“Have you tried a dating app with better matches?”",

     "stem": "The nurse teaches Sam his knee rehab exercises. He says, “I'm a trainer. I know exercise.” Which approach best applies adult learning theory?",

const KEY="exam2-case-v1", PASS="N154";
const QS=[]; CASE.scenes.forEach((s,si)=>s.qs.forEach((q,qi)=>QS.push({...q,si,qi})));
const codeOf=q=>q.options.map((o,i)=>o.c?i+1:0).filter(Boolean).join("");
let S=load()||fresh();
function fresh(){return{name:"",started:false,i:0,start:null,end:null,tries:{},revealed:{},done:false,solved:{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")};
setInterval(()=>{if(S.start)$("#timer").textContent=fmt((S.end||Date.now())-S.start)},1000);
function bar(){const n=Object.keys(S.solved).length;$("#progbar").style.width=(n/QS.length*100)+"%";$("#qchip").textContent=S.done?"Escaped!":S.started?`Door ${Math.min(S.i+1,QS.length)} of ${QS.length}`:"Case study";}
$("#restart").onclick=()=>{$("#restart").style.display="none";$("#rc").classList.add("show")};
$("#rn").onclick=()=>{$("#restart").style.display="";$("#rc").classList.remove("show")};
$("#ry").onclick=()=>{S=fresh();save();$("#timer").textContent="00:00";$("#rn").onclick();render()};
function foot(){return `<div class="foot"><span>NURSE 154 · Olympic College Nursing · Exam 2 review (Modules 6–8) · not graded</span><button class="linkbtn" id="kbtn">Instructor key</button></div>`}
function bindFoot(){$("#kbtn").onclick=openKey}

function render(){bar(); window.scrollTo(0,0);
  if(!S.started) return intro();
  if(S.done) return cert();
  question();
}
function intro(){
  $("#app").innerHTML=`<section class="hero"><h1>The Exam 2 Escape</h1>
  <p>This escape room is a virtual case study. You'll follow one family through Modules 6–8: school-age and teen development, adult health and stress, caring theories, and end-of-life care.</p></section>
  <div class="card"><h3>How to unlock each door</h3><ul class="rules">
  <li>Each question has numbered answer options. Enter the <b>number</b> of the correct answer as the code.</li>
  <li><b>Select all that apply:</b> enter every correct number <b>in numerical order</b>, with no spaces (for example, <span class="code">136</span>).</li>
  <li>A wrong code sends you back to try again. After 3 wrong tries, you can reveal the answer, but reveals count on your certificate.</li>
  <li>Every unlocked door shows the rationale for each option. Read it before moving on.</li></ul></div>
  <div class="card"><h3>Meet the Carter family</h3><div class="fam">${CASE.family.map(f=>`<div><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join("")}</div></div>
  <form id="sf" class="row" style="margin-top:16px"><label class="sr" for="nm">Your first and last name</label>
  <input type="text" id="nm" placeholder="Your first and last name" required maxlength="60" style="flex:1;min-width:240px;max-width:420px">
  <button class="btn" type="submit">Let's get started!</button></form>`+foot();
  bindFoot();
  $("#sf").onsubmit=e=>{e.preventDefault();const n=$("#nm").value.trim();if(!n)return;S.name=n;S.started=true;S.start=Date.now();save();render()};
}
function sceneBox(q){const s=CASE.scenes[q.si];return `<div class="scene"><div class="k">${esc(s.mod)}</div><h2>${esc(s.title)}</h2><p>${esc(s.story)}</p></div>`}
function question(){
  const q=QS[S.i], solved=!!S.solved[S.i], t=S.tries[S.i]||0;
  let h=sceneBox(q)+`<div class="card"><div class="qhead"><span class="qn">Door ${S.i+1} of ${QS.length}</span>${q.sata?'<span class="tag sata">Select all that apply</span>':'<span class="tag">Single answer</span>'}</div>
  <div class="stem">${esc(q.stem)}</div><ol class="opts">`+q.options.map((o,i)=>`<li class="${solved?(o.c?"ok":"no"):""}"><span class="d">${i+1}</span><span>${esc(o.t)}${solved?`<span class="w">${o.c?"✓ Correct. ":"✗ "}${esc(o.w)}</span>`:""}</span></li>`).join("")+`</ol>`;
  if(!solved){
    h+=`<form class="lock" id="lf"><label for="code">🔐 Enter the code to unlock the door${q.sata?" (all correct numbers, in numerical order)":""}</label>
      <div class="row"><input type="text" id="code" inputmode="numeric" autocomplete="off" maxlength="6"><button class="btn" type="submit">Unlock</button>
      ${t>=3?`<button class="btn ghost" type="button" id="rev">Reveal answer</button>`:""}</div><div id="fb"></div></form>`;
  } else {
    h+=`<div class="fb yes">🔓 ${S.revealed[S.i]?"Answer revealed. Code: ":"Door unlocked! Code: "}${codeOf(q)}</div>
      <div class="row" style="margin-top:14px">${S.i>0?`<button class="btn ghost" id="prev">← Previous</button>`:""}<button class="btn coral" id="next">${S.i===QS.length-1?"Finish the case →":"Next door →"}</button></div>`;
  }
  h+=`</div>`+(solved?"":(S.i>0?`<button class="linkbtn" id="prev">← Review the previous door</button>`:""))+foot();
  $("#app").innerHTML=h; bindFoot();
  const p=$("#prev"); if(p) p.onclick=()=>{S.i--;save();render()};
  if(solved){ $("#next").onclick=()=>{ if(S.i===QS.length-1){S.done=true;S.end=Date.now()} else S.i++; save(); render(); }; return; }
  $("#code").focus();
  const r=$("#rev"); if(r) r.onclick=()=>{S.revealed[S.i]=true;S.solved[S.i]=true;save();render()};
  $("#lf").onsubmit=e=>{e.preventDefault();
    const v=$("#code").value.replace(/\D/g,""), want=codeOf(q); if(!v) return;
    if(v===want){S.solved[S.i]=true;save();render();return}
    S.tries[S.i]=(S.tries[S.i]||0)+1;save();
    const sorted=v.split("").sort().join("");
    let msg = (q.sata && sorted===want) ? "Right numbers, but enter them in numerical order." : "That code doesn't unlock the door. Reread the question and try again.";
    if(S.tries[S.i]>=3 && !$("#rev")){ question(); $("#fb").innerHTML=`<div class="fb no">${msg}</div>`; return; }
    $("#fb").innerHTML=`<div class="fb no">${msg}</div>`; $("#code").select();
  };
}
function vcode(){const s=S.name+"|"+S.start+"|"+S.end+"|"+Object.keys(S.revealed).length;let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return "154-"+(h>>>0).toString(36).toUpperCase().padStart(7,"0")}
function cert(){
  const rev=Object.keys(S.revealed).length, first=QS.filter((q,i)=>!S.tries[i]&&!S.revealed[i]).length, d=new Date(S.end);
  $("#app").innerHTML=`<div class="cert"><div style="font-size:40px">🏆</div>
  <div style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700">Certificate of completion</div>
  <h2 style="margin-top:6px">Congratulations,</h2><div class="nm">${esc(S.name)}!</div>
  <p style="max-width:560px;margin:8px auto">You escaped the Exam 2 case study. You followed the Carter family through development, stress, caring and end-of-life care, and unlocked all ${QS.length} doors.</p>
  <div class="stats"><div><b>${first} / ${QS.length}</b>correct on first try</div><div><b>${rev}</b>answers revealed</div><div><b>${fmt(S.end-S.start)}</b>total time</div><div><b>${d.toLocaleDateString()}</b>${d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</div></div>
  <p style="font-size:14px;color:var(--muted)">NURSE 154 · Olympic College Nursing · Exam 2 Review · Verification <span class="code">${vcode()}</span></p></div>
  <p style="text-align:center;color:var(--muted)">📸 Take a screenshot of this certificate and submit it as proof of completion.</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="rv">Review all doors and rationales</button><button class="btn coral" id="ng">Start a new game</button></div>`+foot();
  bindFoot();
  $("#rv").onclick=()=>{S.done=false;S.i=0;save();render()};
  $("#ng").onclick=()=>$("#ry").onclick();
}
function openKey(){
  $("#kb").innerHTML=`<h2>Instructor key</h2><form id="pf" class="row"><input type="password" id="pc" placeholder="Passcode"><button class="btn">Open</button></form><div id="pm"></div>`;
  $("#km").classList.add("open"); $("#pc").focus();
  $("#pf").onsubmit=e=>{e.preventDefault(); if($("#pc").value.trim().toUpperCase()===PASS) showKey(); else $("#pm").innerHTML='<div class="fb no">Incorrect passcode.</div>'};
}
function showKey(){
  let h=`<h2>Instructor key</h2><p>${QS.length} doors in 7 scenes. Codes are the correct option numbers in numerical order.</p><table class="key"><tr><th>Door</th><th>Scene</th><th>Code</th><th>Correct answer(s)</th></tr>`;
  QS.forEach((q,i)=>{h+=`<tr><td>${i+1}</td><td>${q.si+1}</td><td><b>${codeOf(q)}</b></td><td>${q.options.filter(o=>o.c).map(o=>esc(o.t)).join("<br>")}</td></tr>`});
  h+=`</table><div class="row" style="margin-top:14px"><button class="btn ghost" id="ua">Unlock all doors on this device (demo)</button></div>`;
  $("#kb").innerHTML=h;
  $("#ua").onclick=()=>{if(!S.started){S.started=true;S.name="Instructor demo";S.start=Date.now()}QS.forEach((q,i)=>S.solved[i]=true);S.i=0;save();$("#km").classList.remove("open");render()};
}
$("#kx").onclick=()=>$("#km").classList.remove("open");
$("#km").onclick=e=>{if(e.target.id==="km")$("#km").classList.remove("open")};
render(); if(S.start)$("#timer").textContent=fmt((S.end||Date.now())-S.start);
</script>
</body>
